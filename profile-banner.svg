<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Eye profile banner</title>
  <desc id="desc">A dark dusk banner with an abstract eye and language marks.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#121722"/><stop offset=".55" stop-color="#2f2536"/><stop offset="1" stop-color="#70464d"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#e9b36e" stop-opacity=".75"/><stop offset="1" stop-color="#e9b36e" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="260" rx="26" fill="url(#bg)"/>
  <circle cx="1010" cy="46" r="180" fill="url(#glow)" opacity=".55"/>
  <path d="M0 216 C220 150 350 260 575 198 S930 136 1200 206 V260 H0Z" fill="#0a0d14" opacity=".65"/>
