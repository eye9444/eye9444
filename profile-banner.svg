  <text x="394" y="153" fill="#dfcdb8" font-family="monospace" font-size="16" letter-spacing="4">CODE · LANGUAGE · CURIOSITY</text>
  <text x="395" y="194" fill="#e9b36e" font-family="Georgia, serif" font-size="21">বাংলা · हिन्दी · English · 中文 · 日本語</text>
